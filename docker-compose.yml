# =============================================================================
# Honor of Kings Vue App - Docker Compose Configuration
# =============================================================================
# Usage:
#   Build and start: docker-compose up --build -d
#   Stop: docker-compose down
#   View logs: docker-compose logs -f frontend-user
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Frontend User Service
  # ---------------------------------------------------------------------------
  # Vue 3 frontend application served via Nginx
  # Accessible at http://localhost:8081
  # ---------------------------------------------------------------------------
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: honor-of-kings-frontend
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - honor-of-kings-network

# =============================================================================
# Networks
# =============================================================================
networks:
  honor-of-kings-network:
    driver: bridge
